name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (-Xlint:all -Werror), tests, and the README's example from the jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew build
      - name: Diff the README block against the jar's real output
        run: ./scripts/check-readme.sh
      - name: the clean fixture must pass at the strictest level
        run: java -jar build/libs/nginxwarden.jar scan --fail-on low testdata/clean
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore

  secrets:
    name: credsweep over the full commit history
    runs-on: ubuntu-latest
    steps:
      # A shallow clone would let credsweep report a false all-clear.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.27' }
      - run: go install github.com/sriharifortitude/credsweep/cmd/credsweep@v0.1.2
      - run: credsweep scan .
